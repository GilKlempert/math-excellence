<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מסע מצוינות במתמטיקה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap">
<style>
/* Layout: atlas expedition — ink-navy chart table with a graticule, parchment cards as "stations", brass route markers */
:root{
  --ink:#0e1828; --ink2:#14223a; --ink3:#1c2d4a; --grid:rgba(201,160,78,.09);
  --parch:#f2e8d0; --parch2:#e7d8b6; --sepia:#2b2417; --sepia2:#6a5a3d;
  --brass:#c9a04e; --brass2:#e6c67f; --teal:#3a9e97; --teal2:#86d0c9;
  --good:#2f7d4a; --goodbg:#dceadb; --warn:#a86c0c; --warnbg:#f6e4bf; --bad:#a43a2f; --badbg:#f4d8d1;
  --muted:#a3b3c8; --fg:#eef1f6;
  --fd:'Frank Ruhl Libre','David','Times New Roman',serif;
  --fb:'Heebo','Arial Hebrew','Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{direction:rtl}
body{
  background:var(--ink); color:var(--fg); font-family:var(--fb); font-size:16px; line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:56px 56px; min-height:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink2)}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--teal2);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink2);border-bottom:1px solid rgba(201,160,78,.35)}
.bar-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--fd);font-weight:900;font-size:1.15rem;text-decoration:none;color:var(--brass2);white-space:nowrap}
.meter{flex:1;display:flex;align-items:center;gap:10px;min-width:160px}
.track{flex:1;height:8px;border-radius:8px;background:var(--ink3);overflow:hidden;border:1px solid rgba(201,160,78,.25)}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--brass));transition:width .4s ease}
.cnt,.first{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.first b{color:var(--brass2)}

main{max-width:980px;margin:0 auto;padding-block:24px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* hero */
.hero{display:flex;gap:22px;align-items:center;margin-bottom:26px}
.hero svg{flex:none;width:92px;height:92px}
.hero h1{font-family:var(--fd);font-weight:900;font-size:clamp(1.9rem,5vw,2.8rem);line-height:1.1;margin:0;text-wrap:balance}
.hero p{margin:.4rem 0 0;color:var(--muted);max-width:62ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip-i{font-size:.8rem;letter-spacing:.02em;border:1px solid rgba(201,160,78,.45);color:var(--brass2);padding:3px 10px;border-radius:999px;background:rgba(201,160,78,.07)}
.chip-i.t{border-color:rgba(58,158,151,.5);color:var(--teal2);background:rgba(58,158,151,.08)}

.howto{background:var(--ink2);border:1px solid rgba(201,160,78,.25);border-radius:6px;padding:14px 18px;margin-bottom:24px;color:var(--muted);font-size:.93rem}
.howto b{color:var(--fg)}
.reset{margin-top:8px;font-size:.85rem}
.linkbtn{background:none;border:none;padding:0;color:var(--teal2);text-decoration:underline;font-size:inherit}

.label{font-size:.76rem;letter-spacing:.14em;color:var(--brass);font-weight:700;margin:0 0 10px}

/* map nodes */
.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
@media (max-width:760px){.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.node{position:relative;display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--parch);color:var(--sepia);
  border-radius:4px;padding:14px 14px 12px;min-height:150px;overflow:hidden;border:1px solid var(--parch2);
  box-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s ease}
.node:hover{transform:translateY(-2px)}
.node .glyph{position:absolute;left:8px;bottom:-6px;font-family:var(--fd);font-weight:900;font-size:3.1rem;color:rgba(106,90,61,.16);line-height:1;pointer-events:none}
.pin{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--brass2);font-family:var(--fd);font-weight:700;font-size:1.1rem;border:2px solid var(--brass)}
.node.done .pin{background:var(--teal);color:#fff;border-color:var(--teal)}
.node .nm{font-family:var(--fd);font-weight:700;font-size:1.12rem;line-height:1.25}
.node .sub{font-size:.8rem;color:var(--sepia2);line-height:1.35}
.node .st{margin-top:auto;font-size:.78rem;font-variant-numeric:tabular-nums;color:var(--sepia2);position:relative}
.node .mini{height:4px;background:var(--parch2);border-radius:4px;overflow:hidden;margin-top:4px}
.node .mini i{display:block;height:100%;background:var(--teal)}

.special{display:grid;grid-template-columns:2fr 1fr;gap:14px}
@media (max-width:760px){.special{grid-template-columns:1fr}}
.exam-card,.sheet-card{display:flex;flex-direction:column;gap:6px;text-decoration:none;border-radius:4px;padding:18px}
.exam-card{background:linear-gradient(135deg,var(--ink3),var(--ink2));border:1.5px solid var(--brass)}
.exam-card h3,.sheet-card h3{font-family:var(--fd);font-size:1.35rem;margin:0;color:var(--brass2)}
.exam-card p,.sheet-card p{margin:0;color:var(--muted);font-size:.92rem}
.sheet-card{background:var(--ink2);border:1px dashed rgba(58,158,151,.6)}
.sheet-card h3{color:var(--teal2)}

/* station view */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:.9rem;margin-bottom:14px}
.back:hover{color:var(--brass2)}
.shead{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.shead .pin{width:48px;height:48px;font-size:1.5rem;flex:none}
.shead h2{font-family:var(--fd);font-weight:900;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;line-height:1.15;text-wrap:balance}
.shead .sub{color:var(--muted);font-size:.9rem}
.key{background:var(--ink2);border-right:3px solid var(--teal);border-radius:4px;padding:14px 18px;margin-bottom:22px}
.key h4{margin:0 0 6px;font-size:.78rem;letter-spacing:.14em;color:var(--teal2)}
.key ul{margin:0;padding-right:18px;display:grid;gap:4px}
.key li{max-width:70ch}

.qlist{display:grid;gap:16px}
.qcard{background:var(--parch);color:var(--sepia);border-radius:4px;padding:16px 18px;border:2px solid var(--parch2);transition:border-color .2s}
.qcard[data-state="solved"]{border-color:var(--good)}
.qcard[data-state="amber"]{border-color:var(--warn)}
.qcard[data-state="red"]{border-color:var(--bad)}
.qcard[data-state="revealed"]{border-color:var(--sepia2);border-style:dashed}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:.76rem;letter-spacing:.08em;color:var(--sepia2);margin-bottom:6px;flex-wrap:wrap}
.qhead .qn{font-weight:700}
.qtext{font-size:1.08rem;font-weight:500;margin-bottom:12px;min-width:0}
.qbody{min-width:0}

.numrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.numrow input{font:inherit;font-size:1.15rem;width:11rem;max-width:100%;padding:8px 12px;border-radius:4px;border:1.5px solid var(--sepia2);background:#fffaf0;color:var(--sepia);text-align:left;font-variant-numeric:tabular-nums}
.numrow input:disabled{opacity:.85}
.unit{color:var(--sepia2)}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.one{grid-template-columns:1fr}
.opts.nets{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:520px){.opts{grid-template-columns:1fr}.opts.nets{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{text-align:right;padding:10px 12px;border-radius:4px;border:1.5px solid var(--parch2);background:#fffaf0;color:var(--sepia);min-width:0;display:flex;align-items:center;justify-content:flex-start}
.opts.nets .opt{justify-content:center;color:var(--sepia)}
.opt:hover:not(:disabled){border-color:var(--sepia2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.right{border-color:var(--good);background:var(--goodbg)}
.opt:disabled{cursor:default}

.otag{font-size:.78rem;color:var(--sepia2);margin:2px 0 6px}
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.slot{min-width:84px;min-height:46px;padding:6px 10px;border-radius:4px;border:1.5px solid var(--sepia2);background:#fffaf0;color:var(--sepia);display:flex;align-items:center;gap:8px}
.slot.empty{border-style:dashed;background:transparent;color:var(--sepia2);cursor:default}
.slot .sn{font-size:.72rem;color:var(--sepia2);font-variant-numeric:tabular-nums}
.chip{padding:8px 12px;border-radius:999px;border:1.5px solid var(--teal);background:#eaf5f3;color:var(--sepia)}
.slots.ok .slot{border-color:var(--good);background:var(--goodbg)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.mcol{display:grid;gap:8px;align-content:start}
.mbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:4px;border:1.5px solid var(--parch2);background:#fffaf0;color:var(--sepia);text-align:right;min-width:0}
.mbtn.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mbtn.bad{border-color:var(--bad);background:var(--badbg)}
.mbtn.good{border-color:var(--good);background:var(--goodbg)}
.badge{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;background:transparent;border:1.5px dashed var(--sepia2)}
.badge.on{border:none}

.qact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{padding:8px 18px;border-radius:4px;border:1.5px solid var(--ink);background:var(--ink);color:var(--brass2);font-weight:700}
.btn:hover{background:var(--ink3)}
.btn.ghost{background:transparent;color:var(--sepia);border-color:var(--sepia2);font-weight:500}
.btn.ghost:hover{background:var(--parch2)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:var(--ink)}
.btn.brass:hover{background:var(--brass2)}
.fb{margin-top:12px;padding:10px 14px;border-radius:4px;font-size:.95rem}
.fb:empty{display:none}
.fb.good{background:var(--goodbg);color:#1d4a2c;border-right:4px solid var(--good)}
.fb.warn{background:var(--warnbg);color:#5a3a05;border-right:4px solid var(--warn)}
.fb.bad{background:var(--badbg);color:#5b1d16;border-right:4px solid var(--bad)}
.fb.info{background:var(--parch2);color:var(--sepia);border-right:4px solid var(--sepia2)}
.fb b{display:block;margin-bottom:2px}

.snav{display:flex;justify-content:space-between;gap:10px;margin-top:24px;flex-wrap:wrap}
.snav a{color:var(--brass2);text-decoration:none;font-weight:500}
.banner{margin-top:20px;padding:14px 18px;border-radius:4px;background:rgba(58,158,151,.14);border:1px solid var(--teal);color:var(--teal2)}

/* math */
.m{font-family:var(--fb);font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.1;margin:0 .14em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .18em}
.m sup{font-size:.7em}

/* exam */
.exam-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.timer{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700;color:var(--brass2);font-family:var(--fd)}
.timer.low{color:#f08b7c}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--ink3);border:1px solid rgba(201,160,78,.4)}
.dots i.cur{background:var(--brass)}
.dots i.done{background:var(--teal);border-color:var(--teal)}
.intro{background:var(--ink2);border:1.5px solid var(--brass);border-radius:4px;padding:22px}
.intro h2{font-family:var(--fd);font-size:1.8rem;margin:0 0 8px;color:var(--brass2)}
.intro ul{color:var(--muted);padding-right:20px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.score .big{font-family:var(--fd);font-weight:900;font-size:3.4rem;color:var(--brass2);line-height:1}
.score .verdict{font-size:1.1rem}
.break{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 22px}
.break span{font-size:.82rem;padding:4px 10px;border-radius:999px;border:1px solid}
.break .ok{border-color:var(--teal);color:var(--teal2)}
.break .no{border-color:#d58b7f;color:#f0b3a8}
.rev{display:grid;gap:12px}
.rev .qcard .stamp{font-size:.8rem;font-weight:700}
.rev .ok .stamp{color:var(--good)} .rev .no .stamp{color:var(--bad)}

/* sheet */
.sheet{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:700px){.sheet{grid-template-columns:1fr}}
.sheet .key{margin:0;background:var(--parch);color:var(--sepia);border-right-color:var(--brass)}
.sheet .key h4{color:var(--sepia2);font-size:1rem;letter-spacing:0;font-family:var(--fd)}
.tips{margin-top:18px}

@media (max-width:520px){.hero svg{width:64px;height:64px}.match{gap:8px}.mbtn{padding:8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="bar"><div class="bar-in">
  <a href="#" class="brand">מסע מצוינות</a>
  <div class="meter"><div class="track"><div class="fill" id="fill"></div></div><span class="cnt" id="cnt">0/0</span></div>
  <span class="first">בניסיון ראשון: <b id="firstc">0</b></span>
</div></header>
<main id="view"></main>

<script>
document.documentElement.lang='he';document.documentElement.dir='rtl';
/* ---------- helpers ---------- */
const view=document.getElementById('view');
function h(tag,attrs={},html=''){const e=document.createElement(tag);for(const k in attrs){const v=attrs[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}if(html)e.innerHTML=html;return e;}
function fmt(e){return e.replace(/</g,'&lt;')
  .replace(/(\d+)\s(\d+)\/(\d+)/g,(_,w,n,d)=>`${w}<span class="fr"><span>${n}</span><span>${d}</span></span>`)
  .replace(/(\d+)\/(\d+)/g,(_,n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`)
  .replace(/\^(\d+)/g,'<sup>$1</sup>');}
function M(s){return s.replace(/\[\[(.+?)\]\]/g,(_,e)=>`<bdi class="m" dir="ltr">${fmt(e)}</bdi>`);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function shuffleNotId(n){let a;do{a=shuffle([...Array(n).keys()]);}while(a.every((v,i)=>v===i));return a;}
function parseAns(s){s=(s||'').replace(/[−–]/g,'-').replace(/[°₪]/g,'').replace(/,/g,'').replace(/\s+/g,' ').trim();if(!s)return null;let m;
  if(m=s.match(/^(-?\d+) (\d+)\s?\/\s?(\d+)$/))return +m[1]+(+m[2]/+m[3]);
  if(m=s.match(/^(-?\d+(?:\.\d+)?)\s?\/\s?(\d+(?:\.\d+)?)$/))return +m[2]===0?NaN:+m[1]/+m[2];
  if(/^-?\d*\.?\d+$/.test(s))return +s;return NaN;}
function near(v,a){return Math.abs(v-a)<1e-9||(!Number.isInteger(a)&&Math.abs(v-a)<0.006);}
function net(cells){const s=14,w=(Math.max(...cells.map(c=>c[0]))+1)*s,hh=(Math.max(...cells.map(c=>c[1]))+1)*s;
  return `<svg viewBox="-2 -2 ${w+4} ${hh+4}" style="height:70px;width:auto;max-width:100%" aria-hidden="true">${cells.map(([x,y])=>`<rect x="${x*s}" y="${y*s}" width="${s}" height="${s}" fill="#c9a04e" fill-opacity=".35" stroke="#2b2417" stroke-width="1.2"/>`).join('')}</svg>`;}

/* ---------- content ---------- */
const STATIONS=[
{id:'s1',n:1,name:'מספרים טבעיים ופעולות חשבון',sub:'ארבע פעולות · סדר פעולות · חוקי החשבון',glyph:'÷',
 key:`<li><b>סדר פעולות:</b> סוגריים ← חזקות ← כפל וחילוק (לפי סדר הופעתם) ← חיבור וחיסור (לפי סדר הופעתם).</li>
 <li><b>חוק החילוף והקיבוץ:</b> אפשר לשנות סדר ולקבץ בכפל ובחיבור בלבד — לא בחיסור ולא בחילוק.</li>
 <li><b>חוק הפילוג:</b> [[a × (b + c) = a × b + a × c]] — ועובד גם בכיוון ההפוך (הוצאת גורם משותף).</li>
 <li><b>זוגות זהב לחישוב בראש:</b> [[25 × 4 = 100]], [[125 × 8 = 1000]], [[5 × 2 = 10]].</li>`,
 qs:[
 {t:'num',q:'חשבו: [[48 − 12 : 4 × 3 + 2^3]]',a:47,hint:'קודם החזקה, אחר כך חילוק וכפל לפי סדר הופעתם, ורק בסוף חיבור וחיסור.',sol:'[[2^3 = 8]] ; [[12 : 4 = 3]] ואז [[3 × 3 = 9]] ; [[48 − 9 + 8 = 47]].'},
 {t:'mcq',q:'היכן צריך להוסיף סוגריים כדי שיתקבל [[6 + 18 : 3 × 2 − 1 = 15]]?',opts:['[[(6 + 18) : 3 × 2 − 1]]','[[6 + 18 : (3 × 2) − 1]]','[[6 + 18 : 3 × (2 − 1)]]','[[(6 + 18) : (3 × 2) − 1]]'],a:0,one:true,hint:'בלי סוגריים יוצא 17. אילו סוגריים משנים את המחולק?',sol:'[[(6 + 18) = 24]], [[24 : 3 = 8]], [[8 × 2 = 16]], [[16 − 1 = 15]].'},
 {t:'num',q:'חשבו בדרך הקצרה: [[37 × 99 + 37]]',a:3700,hint:'חוק הפילוג עובד גם הפוך — מה משותף לשני המחוברים?',sol:'[[37 × 99 + 37 × 1 = 37 × (99 + 1) = 37 × 100 = 3700]].'},
 {t:'num',q:'חשבו בלי מחשבון: [[125 × 32 × 25]]',a:100000,ans:'100,000',hint:'פרקו את 32 למכפלה של שני מספרים שמתאימים ל-125 ול-25.',sol:'[[32 = 8 × 4]], ולכן [[(125 × 8) × (4 × 25) = 1000 × 100 = 100000]].'},
 {t:'num',q:'איזה מספר חסר? [[24 × ☐ = 8 × 15 × 6]]',a:30,hint:'אפשר לחשב את הצד השני, או לשים לב ש-[[24 = 8 × 3]].',sol:'[[8 × 15 × 6 = 720]] ו-[[720 : 24 = 30]]. דרך קצרה: [[8 × 3 × ☐ = 8 × 90]], לכן [[3 × ☐ = 90]] ו-☐ = 30.'}
 ]},
{id:'s2',n:2,name:'שברים פשוטים',sub:'צמצום והרחבה · השוואה · בעיות מילוליות',glyph:'¾',
 key:`<li><b>צמצום והרחבה:</b> מחלקים או כופלים מונה ומכנה באותו מספר — ערך השבר לא משתנה.</li>
 <li><b>השוואה:</b> מכנה משותף, כפל בהצלבה, או השוואה לשבר "עוגן" כמו [[1/2]] או 1.</li>

function finishExam(){while(exam.res.length<exam.qs.length)exam.res.push(null);exam.done=true;exam.used=Math.min(Date.now(),exam.end)-exam.start;clearInterval(tick);if(location.hash==='#exam')renderExam();}
function renderExam(){view.innerHTML='';view.append(h('a',{class:'back',href:'#'},'→ חזרה למפה'));
 if(!exam){const box=h('div',{class:'intro'},`<h2>סימולציית מבחן</h2><ul><li>12 שאלות — לפחות אחת מכל נושא, בסדר אקראי.</li><li>20 דקות. השעון ממשיך לרוץ גם אם יוצאים למפה.</li><li>בלי רמזים ובלי משוב באמצע — כמו במבחן אמיתי. אפשר לדלג.</li><li>בסוף: ציון, פירוט לפי נושא ופתרון מלא לכל שאלה.</li></ul>`);
  const b=h('button',{type:'button',class:'btn brass'},'התחלת הסימולציה');b.onclick=startExam;box.append(b);view.append(box);return;}
 if(exam.done){renderResults();return;}
 const q=exam.qs[exam.i];const top=h('div',{class:'exam-top'});
 const dots=h('div',{class:'dots','aria-label':`שאלה ${exam.i+1} מתוך ${exam.qs.length}`});exam.qs.forEach((_,k)=>dots.append(h('i',{class:k<exam.i?'done':k===exam.i?'cur':''})));
 top.append(h('div',{},`<div class="label" style="margin:0">שאלה ${exam.i+1} מתוך ${exam.qs.length}</div>`),dots,h('div',{class:'timer',id:'timer'},'--:--'));view.append(top);
 const c=h('article',{class:'qcard'});c.append(h('div',{class:'qhead'},`<span class="qn">${q.st.name}</span><span>${TYPE[q.t]}</span>`));
 c.append(h('div',{class:'qtext'},M(q.q)));const body=h('div',{class:'qbody','data-ex':'x'});c.append(body);const w=W[q.t](q,body);
 const act=h('div',{class:'qact'}),fb=h('div',{class:'fb',role:'status'});
 const go=h('button',{type:'button',class:'btn go'},exam.i===exam.qs.length-1?'שליחה וסיום':'שליחה והמשך');const skip=h('button',{type:'button',class:'btn ghost'},'דילוג');
 act.append(go,skip);c.append(act,fb);view.append(c);
 const advance=r=>{exam.res.push(r);exam.i++;if(exam.i>=exam.qs.length)finishExam();else{renderExam();window.scrollTo(0,0);}};
 go.onclick=()=>{const v=w.get();if(v==null){fb.className='fb info';fb.textContent='השלימו את התשובה, או לחצו "דילוג".';return;}
  if(typeof v==='number'&&Number.isNaN(v)){fb.className='fb info';fb.textContent='לא הצלחתי לקרוא את המספר. כתבו למשל 47, 2.25 או 7/12.';return;}advance(w.check(v));};
 skip.onclick=()=>advance(null);tickFn();}
function renderResults(){const ok=exam.res.filter(r=>r===true).length,n=exam.qs.length;const mins=Math.max(1,Math.round(exam.used/60000));
 const verdict=ok>=11?'רמת נבחרת. מצוין!':ok>=8?'קרוב מאוד. חזרו על הנושאים המסומנים ונסו שוב.':ok>=5?'בסיס טוב. כדאי לעבור שוב על התחנות המסומנות.':'כדאי לעבור על התחנות ולנסות סימולציה נוספת.';
 view.append(h('div',{class:'score'},`<span class="big">${ok}/${n}</span><span class="verdict">${verdict}<br><span style="color:var(--muted);font-size:.9rem">זמן: ${mins} דק׳ מתוך 20</span></span>`));
 const by={};exam.qs.forEach((q,k)=>{const s=q.st;by[s.id]=by[s.id]||{s,ok:0,n:0};by[s.id].n++;if(exam.res[k]===true)by[s.id].ok++;});
 const br=h('div',{class:'break'});Object.values(by).sort((a,b)=>a.s.n-b.s.n).forEach(b=>br.append(h('span',{class:b.ok===b.n?'ok':'no'},`${b.s.n}. ${b.s.name} · ${b.ok}/${b.n}`)));view.append(br);
 const again=h('button',{type:'button',class:'btn brass'},'סימולציה חדשה');again.onclick=startExam;view.append(again);
 view.append(h('p',{class:'label',style:'margin-top:26px'},'פתרונות מלאים'));const rv=h('div',{class:'rev'});
 exam.qs.forEach((q,k)=>{const r=exam.res[k];const c=h('article',{class:'qcard '+(r===true?'ok':'no')});
  c.append(h('div',{class:'qhead'},`<span class="stamp">${r===true?'✓ נכון':r===false?'✗ לא נכון':'דילגת / לא הספקת'}</span><span>${q.st.name}</span>`));
  c.append(h('div',{class:'qtext'},M(q.q)));
  if(q.t==='mcq')c.append(h('div',{class:'fb info'},`<b>התשובה: </b>${M(q.opts[q.a])}`));
  else if(q.t==='num')c.append(h('div',{class:'fb info'},`<b>התשובה: ${q.ans||q.a}${q.unit?' '+q.unit:''}</b>`));
  c.append(h('div',{class:'fb '+(r===true?'good':'warn')},`<b>פתרון:</b>${M(q.sol)}`));
  if(r!==true)c.append(h('div',{class:'snav',style:'margin-top:10px'},`<a href="#${q.st.id}">לתרגול בתחנה ${q.st.n} ←</a>`));rv.append(c);});
 view.append(rv);}

/* ---------- router ---------- */
function route(){const id=location.hash.slice(1);if(SBY[id])renderStation(SBY[id]);else if(id==='exam')renderExam();else if(id==='sheet')renderSheet();else renderMap();progress();window.scrollTo(0,0);}
addEventListener('hashchange',route);route();
</script>
